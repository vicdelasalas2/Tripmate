<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — TripMate</title>
<link rel="icon" type="image/png" href="uploads/avatars/Icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="mobile-header-mount"></div>
    <div id="topbar-mount"></div>
    <div class="page" id="pageContent">
      <div class="page-title anim-fade-up">Dashboard</div>
      <div class="grid g-2col" id="dashGrid"></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/chatbot.js"></script>
<script>
tmMountLayout('dashboard', { cta: { label:'+ New Trip', href:'new-trip.html' } });

function renderDashboard() {
  const state   = getState();
  const user    = state.user;
  const trips   = state.trips;
  const bookings= state.bookings;
  const packing = state.packingItems;

  const nextTrip    = trips.find(t => t.status === 'active') || null;
  const recentBk    = bookings.slice(0, 5);
  const flight      = bookings.find(b => b.type === 'Flight' && b.status === 'Confirmed') || null;
  const packedCount = packing.filter(p => p.packed).length;
  const totalPack   = packing.length;
  const packPct     = totalPack ? Math.round(packedCount / totalPack * 100) : 0;

  const todayActs = nextTrip
    ? (state.activities || []).filter(a => a.tripId === nextTrip.id && a.dayNumber === 1).slice(0,4)
    : [];

  const statusClass = s => s==='Confirmed'?'badge-green':s==='Pending'?'badge-amber':'badge-red';
  const iconMap = { 'Flight':'i-plane','Hotel':'i-bed','Tour / Excursion':'i-compass' };

  // ── LEFT COLUMN ──────────────────────────────────────────────
  const leftCol = `
  <div class="stack">

    <!-- Flight Card -->
    <div class="card card-pad card-hover anim-fade-up delay-1" style="display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <div class="flight-title" style="margin-bottom:0">${flight ? 'Upcoming Flight &middot; ' + escHtml(nextTrip?.destination||'') : 'No Upcoming Flights'}</div>
          ${flight ? '<div class="pulse-live" title="Live status"></div>' : ''}
        </div>
        ${flight ? `
        <div class="flight-badge-row"><span class="badge badge-amber">On Time</span><span style="font-size:12px;color:var(--text-faint)">#${escHtml(flight.ref)}</span></div>
        <div class="flight-detail">Service: <b>${escHtml(flight.provider)}</b></div>
        <div class="flight-detail">Travel Date: <b>${escHtml(flight.dates)}</b></div>
        <div class="flight-detail">Customer: <b>${escHtml(flight.customer)}</b></div>` :
        `<p style="color:var(--text-muted);font-size:13px;line-height:1.6">No confirmed flights yet.<br>Book one from Quick Actions below.</p>`}
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${flight ? `<button class="btn btn-primary" onclick="openBookingModal(${flight.id})">View Details</button>` : ''}
        <a href="itineraries.html" class="btn btn-outline">View Itinerary</a>
      </div>
    </div>

    <!-- Weather + Today's Itinerary -->
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:20px">
      <div class="card card-pad card-hover anim-fade-up delay-2">
        <div class="card-h">Weather</div>
        <div class="weather-temp">${nextTrip ? escHtml(nextTrip.destination.split(',')[0]) : 'N/A'} &mdash; 68&deg;F &#x26C5;</div>
        <div class="weather-row">
          ${[['Sat','64','☀️'],['Sun','68','⛅'],['Mon','69','🌤️'],['Tue','62','🌧️']].map(([d,t,e])=>`
          <div class="weather-day">
            <div style="font-size:18px;margin-bottom:2px">${e}</div>
            ${d}<br><b>${t}&deg;</b>
          </div>`).join('')}
        </div>
      </div>
      <div class="card card-pad card-hover anim-fade-up delay-2">
        <div class="card-h-row">
          <div class="card-h" style="margin-bottom:0">Today's Itinerary</div>
          <a href="itineraries.html" class="view-all-link">View All</a>
        </div>
        <div style="margin-top:10px">
          ${todayActs.length ? todayActs.map(a=>`
          <div class="itin-row">
            <b>${escHtml(a.timeSlot)}</b>
            <span>${escHtml(a.title)}</span>
          </div>`).join('') : '<div class="itin-row" style="color:var(--text-faint)">No activities scheduled.</div>'}
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid g-3">
      <div class="card card-pad stat-card card-hover anim-fade-up delay-3">
        <div class="stat-dot" style="background:linear-gradient(135deg,#3b82f6,#2563eb)">
          <svg style="width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M12 21s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>
        </div>
        <div><div class="stat-num">${trips.length}</div><div class="stat-label">Total Trips</div></div>
      </div>
      <div class="card card-pad stat-card card-hover anim-fade-up delay-3">
        <div class="stat-dot" style="background:linear-gradient(135deg,#f2684f,#e0574e)">
          <svg style="width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M10.5 21 12 15.5 4 13v-2l9-3V5a1.6 1.6 0 1 1 3.2 0v3l9 3v2l-8 2.5L20.5 21l-1.7.6L14 17.4l-1.8 4.2z"/></svg>
        </div>
        <div><div class="stat-num">48,200</div><div class="stat-label">Miles Traveled</div></div>
      </div>
      <div class="card card-pad stat-card card-hover anim-fade-up delay-3">
        <div class="stat-dot" style="background:linear-gradient(135deg,#22c55e,#15803d)">
          <svg style="width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="m12 3 2.6 5.9L21 9.6l-4.7 4.3L17.6 21 12 17.7 6.4 21l1.3-7.1L3 9.6l6.4-.7z"/></svg>
        </div>
        <div><div class="stat-num">12,450</div><div class="stat-label">Reward Points</div></div>
      </div>
    </div>

    <!-- Recent Bookings -->
    <div class="card card-pad card-hover anim-fade-up delay-4">
      <div class="card-h-row">
        <div class="card-h" style="margin-bottom:0">Recent Bookings</div>
        <a href="bookings.html" class="view-all-link">See All →</a>
      </div>
      <div style="margin-top:12px">
        ${recentBk.length ? recentBk.map(bk=>`
        <div class="booking-row" onclick="openBookingModal(${bk.id})">
          <div>
            <div class="bk-name">${escHtml(bk.provider)}</div>
            <div class="bk-date">${escHtml(bk.dates)}</div>
          </div>
          <span class="badge ${statusClass(bk.status)}">${bk.status}</span>
        </div>`).join('') :
        `<p style="font-size:13px;color:var(--text-faint);text-align:center;padding:16px 0">No bookings yet.</p>`}
      </div>
    </div>
  </div>`;

  // ── RIGHT COLUMN ─────────────────────────────────────────────
  const rightCol = `
  <div class="stack">

    <!-- Next Trip -->
    ${nextTrip ? `
    <div class="next-trip anim-slide-r delay-1" onclick="window.location='itineraries.html'">
      <div class="label">NEXT TRIP</div>
      <h3>${escHtml(nextTrip.destination)}</h3>
      <p>${daysUntil(nextTrip.startDate)}</p>
      <div class="next-trip-bar"><span id="tripBar" style="width:0%"></span></div>
      <div style="display:flex;gap:10px;position:relative">
        <a href="itineraries.html" class="btn btn-block" style="background:rgba(255,255,255,.18);color:#fff;flex:1" onclick="event.stopPropagation()">View Itinerary</a>
        <button class="btn" style="background:rgba(255,255,255,.12);color:#fff;padding:10px 14px" onclick="event.stopPropagation();showTripDetail()" title="Trip details">
          <svg style="width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".4" fill="currentColor"/></svg>
        </button>
      </div>
    </div>` : `
    <div class="card card-pad card-hover anim-slide-r delay-1" style="text-align:center;padding:32px 24px">
      <div style="width:52px;height:52px;border-radius:14px;background:var(--blue-100);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <svg style="width:24px;height:24px;stroke:var(--blue-600);fill:none;stroke-width:1.8" viewBox="0 0 24 24"><path d="M12 21s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>
      </div>
      <div style="font-weight:800;font-size:15px;margin-bottom:6px">No Upcoming Trips</div>
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Start planning your next adventure.</p>
      <a href="new-trip.html" class="btn btn-primary btn-block">Plan a Trip</a>
    </div>`}

    <!-- Packing List -->
    <div class="card card-pad card-hover anim-slide-r delay-2">
      <div class="card-h-row">
        <div class="card-h" style="margin-bottom:0">Packing List</div>
        <span style="font-size:12px;font-weight:700;color:var(--text-faint)">${packedCount}/${totalPack}</span>
      </div>
      <div class="pack-progress" style="margin-top:12px"><div class="pack-progress-fill" id="packFill" style="width:0%"></div></div>
      <div class="pack-meta" id="packMeta">${packPct}% packed</div>
      <div id="packList">
        ${packing.map(item=>`
        <div class="pack-row ${item.packed?'done':''}" id="pack-${item.id}" onclick="togglePack(${item.id})">
          <input type="checkbox" ${item.packed?'checked':''} onclick="event.stopPropagation();togglePack(${item.id})">
          <span>${escHtml(item.name)}</span>
        </div>`).join('')}
      </div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <input type="text" id="newPackItem" class="field" style="margin:0;flex:1;padding:9px 12px;font-size:13px;border:1.4px solid var(--border);border-radius:9px;outline:none" placeholder="Add item…"
          onkeydown="if(event.key==='Enter')addPackItem()">
        <button class="btn btn-outline-blue btn-sm" onclick="addPackItem()">+ Add</button>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="card card-pad card-hover anim-slide-r delay-3">
      <div class="card-h">Quick Actions</div>
      <a href="new-booking.html?type=Flight" class="btn btn-block qa-btn" style="background:var(--blue-100);color:var(--blue-600);margin-bottom:9px">
        <svg class="qa-btn" style="display:inline"><path d="M10.5 21 12 15.5 4 13v-2l9-3V5a1.6 1.6 0 1 1 3.2 0v3l9 3v2l-8 2.5L20.5 21l-1.7.6L14 17.4l-1.8 4.2z" fill="none" stroke="var(--blue-600)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Book Flight
      </a>
      <a href="new-booking.html?type=Hotel" class="btn btn-block qa-btn" style="background:var(--coral-50);color:var(--coral-600);margin-bottom:9px">
        <svg style="width:15px;height:15px;stroke:var(--coral-600);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:inline-block" viewBox="0 0 24 24"><path d="M3 19v-8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8M3 15h18M3 19v2M21 19v2"/><rect x="5" y="9" width="6" height="4" rx="1"/></svg>
        Book Hotel
      </a>
      <a href="new-booking.html?type=Tour+%2F+Excursion" class="btn btn-block qa-btn" style="background:var(--green-50);color:var(--green-600)">
        <svg style="width:15px;height:15px;stroke:var(--green-600);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:inline-block" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
        Add Excursion
      </a>
    </div>

    <!-- Travel Tips -->
    <div class="card card-pad card-hover anim-slide-r delay-4">
      <div class="card-h">Travel Tips</div>
      ${[
        'Check passport validity — many countries require 6+ months remaining.',
        'Book airport transfers in advance to avoid last-minute stress.',
        'Notify your bank before international travel to avoid card blocks.',
        'Download offline maps for destinations with limited connectivity.',
        'Pack a portable charger — travel days drain your battery fast.'
      ].map(t=>`<div class="tip-row"><div class="tip-dot"></div><span>${t}</span></div>`).join('')}
    </div>
  </div>`;

  document.getElementById('dashGrid').innerHTML = leftCol + rightCol;

  // Animate progress bars after render
  requestAnimationFrame(() => {
    setTimeout(() => {
      const pf = document.getElementById('packFill');
      if (pf) pf.style.width = packPct + '%';
      const tb = document.getElementById('tripBar');
      if (tb && nextTrip) {
        const start = new Date(nextTrip.startDate).getTime();
        const end   = new Date(nextTrip.endDate).getTime();
        const now   = Date.now();
        const pct   = Math.min(100, Math.max(0, Math.round((now - start) / (end - start) * 100)));
        tb.style.width = pct + '%';
      }
    }, 120);
  });
}

function togglePack(id) {
  const state = getState();
  const item  = state.packingItems.find(p => p.id === id);
  if (!item) return;
  item.packed = !item.packed;
  setState({ packingItems: state.packingItems });
  renderDashboard();
  showToast(item.packed ? `✓ ${item.name} packed!` : `${item.name} unpacked`, item.packed ? 'success' : 'info');
}

function addPackItem() {
  const input = document.getElementById('newPackItem');
  const name  = input?.value.trim();
  if (!name) return;
  const state = getState();
  const newItem = { id: state.nextPackingId, name, packed: false };
  state.packingItems.push(newItem);
  state.nextPackingId++;
  setState(state);
  renderDashboard();
  showToast(`"${name}" added to packing list`, 'success');
}

function showTripDetail() {
  const state = getState();
  const trip  = state.trips.find(t => t.status === 'active');
  if (!trip) return;
  showModal({
    icon: '✈️', iconBg: 'var(--blue-100)', wide: true,
    title: trip.name,
    subtitle: trip.destination,
    content: `
      <div class="booking-detail-row"><span class="label">Destination</span><span class="value">${escHtml(trip.destination)}</span></div>
      <div class="booking-detail-row"><span class="label">Dates</span><span class="value">${fmtDate(trip.startDate)} – ${fmtDate(trip.endDate)}</span></div>
      <div class="booking-detail-row"><span class="label">Trip Type</span><span class="value">${escHtml(trip.type)}</span></div>
      <div class="booking-detail-row"><span class="label">Travelers</span><span class="value">${trip.travelers}</span></div>
      <div class="booking-detail-row"><span class="label">Budget</span><span class="value">$${trip.budgetMin.toLocaleString()} – $${trip.budgetMax.toLocaleString()}</span></div>
      <div class="booking-detail-row"><span class="label">Accommodation</span><span class="value">${escHtml(trip.accommodation)}</span></div>
      <div class="booking-detail-row"><span class="label">Meal Plan</span><span class="value">${escHtml(trip.mealPlan)}</span></div>
      <div class="booking-detail-row"><span class="label">Status</span><span class="value"><span class="badge badge-green">${trip.status}</span></span></div>`,
    actions: `<button class="btn btn-outline" onclick="closeModal()">Close</button>
              <a href="itineraries.html" class="btn btn-primary">View Itinerary</a>`
  });
}

renderDashboard();
</script>
</body>
</html>
