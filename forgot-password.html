<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — TripMate</title>
<link rel="icon" type="image/png" href="uploads/avatars/Icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="forgot-wrap">
  <div class="forgot-card anim-scale">
    <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#dbe6fe,#c1d4fd);display:flex;align-items:center;justify-content:center;margin-bottom:18px">
      <svg style="width:24px;height:24px;stroke:var(--blue-600);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    </div>
    <h2>Forgot your password?</h2>
    <p>Enter your email and we'll send you a reset link. Check your spam folder if you don't see it within a few minutes.</p>

    <!-- Step 1: Email input -->
    <div id="step1">
      <form onsubmit="sendReset(event)">
        <div class="field">
          <label>Email address</label>
          <input type="email" id="resetEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="resetBtn">Send Reset Link</button>
      </form>
    </div>

    <!-- Step 2: Success state (hidden initially) -->
    <div id="step2" style="display:none;text-align:center">
      <div style="width:60px;height:60px;border-radius:50%;background:var(--green-50);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
        <svg style="width:28px;height:28px;stroke:var(--green-600);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h3 style="font-size:17px;font-weight:800;margin-bottom:8px">Check your inbox</h3>
      <p id="step2Email" style="color:var(--text-muted);font-size:13.5px;margin-bottom:20px"></p>
      <button onclick="tryAgain()" class="btn btn-outline btn-block" style="margin-bottom:10px">Send again</button>
      <a href="login.html" class="btn btn-primary btn-block">Back to Sign In</a>
    </div>

    <a href="login.html" class="forgot-back">← Back to Login</a>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  function sendReset(e) {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value.trim();
    const btn   = document.getElementById('resetBtn');
    btn.textContent = 'Sending…';
    btn.disabled = true;

    setTimeout(() => {
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = '';
      document.getElementById('step2Email').textContent =
        `We've sent a reset link to ${email}. The link expires in 30 minutes.`;
    }, 1200);
  }

  function tryAgain() {
    document.getElementById('step1').style.display = '';
    document.getElementById('step2').style.display = 'none';
    const btn = document.getElementById('resetBtn');
    btn.textContent = 'Send Reset Link';
    btn.disabled = false;
    document.getElementById('resetEmail').value = '';
    document.getElementById('resetEmail').focus();
  }
</script>
</body>
</html>
