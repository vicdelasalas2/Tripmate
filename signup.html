<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — TripMate</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-split">

  <!-- Art Panel -->
  <div class="auth-art">
    <div class="auth-art-logo"><span class="trip">Trip</span><span class="mate">Mate</span></div>
    <div class="auth-art-tag">PLAN &middot; TRAVEL &middot; EXPLORE</div>
    <svg class="auth-art-wave" width="280" height="200" viewBox="0 0 280 200" fill="none">
      <path d="M0 100 Q35 60 70 100 Q105 140 140 100 Q175 60 210 100 Q245 140 280 100" stroke="white" stroke-width="2.5" fill="none"/>
      <path d="M0 130 Q35 90 70 130 Q105 170 140 130 Q175 90 210 130 Q245 170 280 130" stroke="white" stroke-width="1.5" fill="none" opacity=".5"/>
    </svg>
    <div style="margin-top:40px;display:flex;flex-direction:column;gap:16px;width:100%;max-width:240px">
      <div style="display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.8);font-size:13px">
        <div style="width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0">✈️</div>
        Smart itinerary builder
      </div>
      <div style="display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.8);font-size:13px">
        <div style="width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0">🤖</div>
        AI travel assistant
      </div>
      <div style="display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.8);font-size:13px">
        <div style="width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0">📦</div>
        Curated travel packages
      </div>
      <div style="display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.8);font-size:13px">
        <div style="width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0">🆓</div>
        Free to get started
      </div>
    </div>
  </div>

  <!-- Form Panel -->
  <div class="auth-panel">
    <div class="auth-box">
      <h2>Create your account</h2>
      <p class="sub">Start planning amazing trips today</p>

      <!-- Account type toggle -->
      <div class="acct-toggle" id="acctToggle">
        <div class="acct-opt checked" onclick="setAcctType('traveler', this)">🧳 Traveler Account</div>
        <div class="acct-opt" onclick="setAcctType('agency', this)">🏢 Agency Administrator</div>
      </div>

      <!-- OAuth -->
      <button class="oauth-btn" onclick="oauthSignup('google')">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign up with Google
      </button>

      <div class="or-divider">or sign up with email</div>

      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="field-row">
          <div class="field">
            <label>First Name <span class="req">*</span></label>
            <input type="text" id="signupFirst" placeholder="Jane" required>
          </div>
          <div class="field">
            <label>Last Name <span class="req">*</span></label>
            <input type="text" id="signupLast" placeholder="Smith" required>
          </div>
        </div>
        <div class="field">
          <label>Email address <span class="req">*</span></label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label>Password <span class="req">*</span></label>
          <div class="pass-wrap">
            <input type="password" id="signupPass" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
            <button type="button" class="pass-eye" onclick="togglePassword('signupPass', this)" aria-label="Show password">
              <svg class="icon" viewBox="0 0 24 24"><use href="#i-eye"/></svg>
            </button>
          </div>
          <div id="passStrength" style="height:3px;border-radius:99px;margin-top:6px;background:var(--border);overflow:hidden"><div id="passBar" style="height:100%;width:0;transition:width .3s,background .3s;border-radius:99px"></div></div>
          <span id="passHint" class="help-text"></span>
        </div>
        <label class="checkbox-row" style="margin-bottom:18px">
          <input type="checkbox" id="termsCheck" required>
          I agree to the <a href="#" style="color:var(--blue-600)">Terms of Service</a> and <a href="#" style="color:var(--blue-600)">Privacy Policy</a>
        </label>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="signupBtn">Create Account</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  document.body.insertAdjacentHTML('afterbegin', `<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M17.9 17.9A10 10 0 0 1 12 19c-6.4 0-10-7-10-7a17.5 17.5 0 0 1 4.1-5.1M9.9 4.2A10 10 0 0 1 12 4c6.4 0 10 7 10 7a17.5 17.5 0 0 1-2.4 3.4M3 3l18 18"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>`);

  let selectedAcctType = 'traveler';

  function setAcctType(type, el) {
    selectedAcctType = type;
    document.querySelectorAll('.acct-opt').forEach(o => o.classList.remove('checked'));
    el.classList.add('checked');
  }

  function handleSignup(e) {
    e.preventDefault();
    const first = document.getElementById('signupFirst').value.trim();
    const last  = document.getElementById('signupLast').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const pass  = document.getElementById('signupPass').value;
    const terms = document.getElementById('termsCheck').checked;
    const btn   = document.getElementById('signupBtn');

    if (!first || !last || !email || !pass) { alert('Please fill in all required fields.'); return; }
    if (pass.length < 8) { alert('Password must be at least 8 characters.'); return; }
    if (!terms) { alert('Please agree to the Terms of Service.'); return; }

    btn.textContent = 'Creating account…';
    btn.disabled = true;

    setTimeout(() => {
      const state = getState();
      state.user = { ...state.user, name: `${first} ${last}`, email, accountType: selectedAcctType };
      setState(state);
      window.location.href = 'dashboard.html';
    }, 1000);
  }

  function oauthSignup(provider) {
    const btns = document.querySelectorAll('.oauth-btn');
    btns.forEach(b => { b.disabled = true; });
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
  }

  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.innerHTML = isPass
      ? `<svg class="icon" viewBox="0 0 24 24"><use href="#i-eye-off"/></svg>`
      : `<svg class="icon" viewBox="0 0 24 24"><use href="#i-eye"/></svg>`;
  }

  // Password strength meter
  document.getElementById('signupPass').addEventListener('input', function() {
    const val = this.value;
    const bar  = document.getElementById('passBar');
    const hint = document.getElementById('passHint');
    let strength = 0;
    if (val.length >= 8)                          strength++;
    if (/[A-Z]/.test(val) && /[a-z]/.test(val))  strength++;
    if (/\d/.test(val))                           strength++;
    if (/[^A-Za-z0-9]/.test(val))                strength++;

    const widths = ['0%','30%','55%','80%','100%'];
    const colors = ['#dc2626','#d97706','#eab308','#22c55e','#15803d'];
    const labels = ['','Weak','Fair','Good','Strong'];
    bar.style.width    = widths[strength];
    bar.style.background = colors[strength] || '#dc2626';
    hint.textContent   = labels[strength] || '';
    hint.style.color   = colors[strength] || 'inherit';
  });
</script>
</body>
</html>
