<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Booking — TripMate</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-col">
    <div id="mobile-header-mount"></div>
    <div id="topbar-mount"></div>
    <div class="page">
      <div class="page-breadcrumb anim-fade">
        <a href="bookings.html">Bookings</a>
        <span>›</span>
        <span class="current" id="breadcrumbLabel">New Booking</span>
      </div>
      <div class="page-title anim-fade-up" id="pageHeading">New Booking</div>

      <div class="grid g-2col anim-fade-up delay-1">
        <div>
          <div class="card card-pad">
            <div class="card-h">Booking Details</div>
            <form id="bookingForm" onsubmit="saveBooking(event)">

              <div class="field">
                <label>Booking Type <span class="req">*</span></label>
                <select id="bkType" required onchange="updateTypeUI()">
                  <option value="Flight">✈️ Flight</option>
                  <option value="Hotel">🏨 Hotel</option>
                  <option value="Tour / Excursion">🧭 Tour / Excursion</option>
                </select>
              </div>

              <div class="field">
                <label>Customer Name <span class="req">*</span></label>
                <input type="text" id="bkCustomer" placeholder="e.g. John Smith" required>
              </div>

              <div class="field">
                <label id="providerLabel">Service Provider <span class="req">*</span></label>
                <input type="text" id="bkProvider" placeholder="e.g. Delta Airlines" required>
              </div>

              <div class="field">
                <label id="datesLabel">Travel Dates <span class="req">*</span></label>
                <input type="text" id="bkDates" placeholder="e.g. Aug 10 – Aug 16, 2026" required>
              </div>

              <div class="field">
                <label>Amount (USD) <span class="req">*</span></label>
                <input type="number" id="bkAmount" placeholder="0.00" min="0" step="0.01" required>
              </div>

              <div class="field">
                <label>Status</label>
                <select id="bkStatus">
                  <option value="Pending">Pending</option>
                  <option value="Confirmed">Confirmed</option>
                  <option value="Cancelled">Cancelled</option>
                </select>
              </div>

              <div class="field">
                <label>Notes</label>
                <textarea id="bkNotes" rows="3" placeholder="Confirmation numbers, special requests, etc."></textarea>
              </div>

              <div class="form-actions">
                <a href="bookings.html" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary" id="submitBtn">Create Booking</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Sidebar info -->
        <div class="stack">
          <div class="card card-pad" id="typeInfoCard">
            <div class="card-h" id="typeInfoTitle">✈️ Flight Booking</div>
            <p id="typeInfoBody" style="font-size:13px;color:var(--text-muted);line-height:1.6"></p>
          </div>

          <div class="card card-pad" style="background:var(--blue-100);border-color:#c1d4fd">
            <div style="font-size:13px;font-weight:700;color:var(--blue-600);margin-bottom:8px">💡 Tips</div>
            <div id="typeTips" style="font-size:12.5px;color:var(--blue-600);line-height:1.7"></div>
          </div>

          <div class="card card-pad">
            <div class="card-h">Recent Bookings</div>
            <div id="recentBkList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/chatbot.js"></script>
<script>
tmMountLayout('bookings', { cta: { label:'+ New Booking', href:'new-booking.html' } });

const TYPE_INFO = {
  'Flight': {
    icon: '✈️', title: 'Flight Booking',
    body: 'Record your flight details including airline, flight number, departure/arrival times, and seat class.',
    tips: ['Add the flight number in the provider field (e.g. Delta DL245)', 'Include both departure and arrival dates', 'Keep your booking reference handy']
  },
  'Hotel': {
    icon: '🏨', title: 'Hotel Booking',
    body: 'Track your hotel reservation with check-in/out dates, room type, and confirmation number.',
    tips: ['Include check-in and check-out dates', 'Note your room type or special requests', 'Save the hotel confirmation number']
  },
  'Tour / Excursion': {
    icon: '🧭', title: 'Tour / Excursion Booking',
    body: 'Log tours, activities, transfers, and excursion bookings with operator details and meeting points.',
    tips: ['Note the meeting point or pickup location', 'Include the tour operator contact info', 'Check cancellation policy in notes']
  }
};

let editId = null;

function init() {
  const params  = new URLSearchParams(window.location.search);
  const typeParam = params.get('type');
  editId = parseInt(params.get('edit')) || null;

  if (editId) {
    loadEditMode(editId);
  } else if (typeParam) {
    document.getElementById('bkType').value = decodeURIComponent(typeParam);
    const prov = params.get('provider');
    if (prov) document.getElementById('bkProvider').value = decodeURIComponent(prov);
  }

  updateTypeUI();
  renderRecentBookings();
}

function loadEditMode(id) {
  const state = getState();
  const bk    = state.bookings.find(b => b.id === id);
  if (!bk) { window.location.href = 'bookings.html'; return; }

  document.getElementById('breadcrumbLabel').textContent = 'Edit Booking';
  document.getElementById('pageHeading').textContent     = 'Edit Booking';
  document.getElementById('submitBtn').textContent       = 'Save Changes';

  document.getElementById('bkType').value     = bk.type;
  document.getElementById('bkCustomer').value = bk.customer;
  document.getElementById('bkProvider').value = bk.provider;
  document.getElementById('bkDates').value    = bk.dates;
  document.getElementById('bkAmount').value   = bk.amount;
  document.getElementById('bkStatus').value   = bk.status;
}

function updateTypeUI() {
  const type = document.getElementById('bkType').value;
  const info = TYPE_INFO[type] || TYPE_INFO['Flight'];
  document.getElementById('typeInfoTitle').textContent = `${info.icon} ${info.title}`;
  document.getElementById('typeInfoBody').textContent  = info.body;
  document.getElementById('typeTips').innerHTML        = info.tips.map(t=>`• ${t}`).join('<br>');

  const pLabels = { 'Flight':'Airline & Flight Number','Hotel':'Hotel Name','Tour / Excursion':'Tour Operator' };
  const dLabels = { 'Flight':'Departure Date / Route','Hotel':'Check-in – Check-out Dates','Tour / Excursion':'Tour Date' };
  document.getElementById('providerLabel').innerHTML = `${pLabels[type]||'Service Provider'} <span class="req">*</span>`;
  document.getElementById('datesLabel').innerHTML    = `${dLabels[type]||'Travel Dates'} <span class="req">*</span>`;
  document.getElementById('bkProvider').placeholder  = pLabels[type] === 'Airline & Flight Number' ? 'e.g. Delta Airlines (DL245)' : `e.g. ${pLabels[type]}`;
}

function renderRecentBookings() {
  const state = getState();
  const bks   = state.bookings.slice(0, 4);
  const list  = document.getElementById('recentBkList');
  const statusClass = s => s==='Confirmed'?'badge-green':s==='Pending'?'badge-amber':'badge-red';
  if (!bks.length) { list.innerHTML = `<p style="color:var(--text-faint);font-size:13px">No bookings yet.</p>`; return; }
  list.innerHTML = bks.map(bk=>`
    <div class="booking-row" onclick="openBookingModal(${bk.id})">
      <div>
        <div class="bk-name">${escHtml(bk.provider)}</div>
        <div class="bk-date">${escHtml(bk.dates)}</div>
      </div>
      <span class="badge ${statusClass(bk.status)}">${bk.status}</span>
    </div>`).join('');
}

function saveBooking(e) {
  e.preventDefault();
  const type     = document.getElementById('bkType').value;
  const customer = document.getElementById('bkCustomer').value.trim();
  const provider = document.getElementById('bkProvider').value.trim();
  const dates    = document.getElementById('bkDates').value.trim();
  const amount   = parseFloat(document.getElementById('bkAmount').value) || 0;
  const status   = document.getElementById('bkStatus').value;
  const btn      = document.getElementById('submitBtn');

  btn.textContent = 'Saving…'; btn.disabled = true;

  setTimeout(() => {
    const state = getState();
    if (editId) {
      const bk = state.bookings.find(b => b.id === editId);
      if (bk) { bk.type = type; bk.customer = customer; bk.provider = provider; bk.dates = dates; bk.amount = amount; bk.status = status; }
      setState(state);
      showToast('Booking updated!', 'success');
    } else {
      const ref = 'BK-' + (9020 + state.bookings.length + 1);
      state.bookings.unshift({ id: state.nextBookingId, ref, type, customer, provider, dates, amount, status });
      state.nextBookingId++;
      setState(state);
      showToast('Booking created!', 'success');
    }
    setTimeout(() => window.location.href = 'bookings.html', 800);
  }, 700);
}

init();
</script>
</body>
</html>
